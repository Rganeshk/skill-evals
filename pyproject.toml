[project]
name = "skill-evals"
version = "0.1.0"
description = "Dockerized skill evaluations for OpenHands Software Agent SDK"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
    "pyyaml>=6.0",
    # LLM-as-a-Judge (tools/llm_judge.py) — provider-agnostic via LiteLLM
    "litellm>=1.50",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
